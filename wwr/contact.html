<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Splash White Water Rafting</title>
    <meta name="description"
      content="Contact Splash White Water Rafting Company for reservations, general inquiries, and support. We are here to serve you.">
    <meta name="author" content="Bright Anibra">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>
                123 Main River Street<br>
                Kolob, California 12345<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>
        </section>

        <div class="contact-grid">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.681424!2d-122.4194!3d37.7749!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDQ2JzI5LjYiTiAxMjLCsDI1JzA5LjgiVw!5e0!3m2!1sen!2sus!4v1"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form class="contact-form">
                <label for="fullname">Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Placeholder">

                <label for="useremail">Email</label>
                <input type="email" id="useremail" name="useremail" placeholder="Placeholder">

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label for="purpose-general"><input type="radio" id="purpose-general"
                          name="purpose" value="general" checked> General Inquiry</label>
                    <label for="purpose-reservation"><input type="radio" id="purpose-reservation"
                          name="purpose" value="reservation"> Reservation Question</label>
                    <label for="purpose-suggestion"><input type="radio" id="purpose-suggestion"
                          name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>

                <label class="newsletter" for="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe"> Please Subscribe me to
                    the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee 1">
                    <figcaption>Director</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee 2">
                    <figcaption>Managing Director</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee 3">
                    <figcaption>Human Resources</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Splash White Water Rafting | Bright Anibra</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook icon"></a>
            <a href="https://x.com"><img src="images/twitter.svg" alt="Twitter icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg"
                  alt="Instagram icon"></a>
        </nav>
    </footer>
</body>

</html>
