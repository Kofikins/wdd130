<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapids White Water Rafting</title>
    <meta name="description" content="Contact White Water Rafting Company">
    <meta name="author" content="Bright Anibra">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>

        <div class="contact-layout">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d12345!2d-111.0!3d39.0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1234567890"
              allowfullscreen="" loading="lazy"></iframe>

            <form class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Placeholder">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Placeholder">

                <p>Message Purpose</p>
                <label><input type="radio" name="purpose" checked> General Inquiry</label>
                <label><input type="radio" name="purpose"> Reservation Question</label>
                <label><input type="radio" name="purpose"> Website Suggestion</label>

                <label for="message">Message</label>
                <textarea id="message" placeholder="Type here"></textarea>

                <label><input type="checkbox" checked> Please Subscribe me to the monthly
                    newsletter</label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employees-grid">
                <figure><img src="images/employee1.jpg" alt="Employee">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure><img src="images/employee2.jpg" alt="Employee">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure><img src="images/employee3.jpg" alt="Employee">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rapids White Water Rafting | Bright Anibra</p>
        <div class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
        </div>
    </footer>
</body>

</html>
